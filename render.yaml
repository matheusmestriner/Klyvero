services:
  - type: web
    name: klyvero-api-v6-free
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/matheusmestriner/Klyvero
    branch: main
    autoDeployTrigger: commit
    buildCommand: >-
      rm -rf .api-runtime &&
      mkdir .api-runtime &&
      cat deploy/api-source-v3.b64.* | base64 -d > /tmp/klyvero-api.tgz &&
      echo '8008fe53c084f7161a7bb517100977c9c298e9cb57f333816dd89bd10e4d37ec  /tmp/klyvero-api.tgz' | sha256sum -c - &&
      tar -xzf /tmp/klyvero-api.tgz -C .api-runtime &&
      cd .api-runtime &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @klyvero/api prisma:generate &&
      pnpm --filter @klyvero/api db:push &&
      pnpm --filter @klyvero/api build
    startCommand: >-
      cd .api-runtime &&
      export JWT_ACCESS_SECRET="$(printf '%s' "$JWT_ACCESS_SEED" | sha512sum | cut -d' ' -f1)" &&
      export JWT_REFRESH_SECRET="$(printf '%s' "$JWT_REFRESH_SEED" | sha512sum | cut -d' ' -f1)" &&
      exec pnpm --filter @klyvero/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://klyvero-app-v3-free.onrender.com
      - key: API_PUBLIC_URL
        value: https://klyvero-api-v6-free.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: klyvero-db-free
          property: connectionString
      # No Redis/WhatsApp bridge service is deployed yet. RedisService fails
      # fast (enableOfflineQueue: false) and every caller already falls back
      # to in-memory limiting, so the app runs without REDIS_URL -- queue
      # workers just stay disabled (RUN_QUEUE_WORKERS=false) until a real
      # Key Value instance is provisioned.
      - key: WHATSAPP_INTERNAL_TOKEN
        generateValue: true
      - key: BOOTSTRAP_ENABLED
        value: 'true'
      - key: BOOTSTRAP_TOKEN
        sync: false
      - key: JWT_ACCESS_SEED
        generateValue: true
      - key: JWT_REFRESH_SEED
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_THROTTLE_SECRET
        generateValue: true
      - key: EMAIL_LINK_SIGNING_SECRET
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: klyvero-api
      - key: JWT_AUDIENCE
        value: klyvero-web
      - key: RUN_QUEUE_WORKERS
        value: 'false'
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: COOKIE_SECURE
        value: 'true'
      - key: ALLOW_PRIVATE_SMTP
        value: 'false'
      - key: ALLOW_PRIVATE_WEBHOOKS
        value: 'false'
      - key: SMTP_DEFAULT_HOST
        sync: false
      - key: SMTP_DEFAULT_PORT
        value: '587'
      - key: SMTP_DEFAULT_SECURE
        value: 'false'
      - key: SMTP_DEFAULT_USER
        sync: false
      - key: SMTP_DEFAULT_PASS
        sync: false
