services:
  - type: web
    name: klyvero-api-v6-free
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/matheusmestriner/Klyvero
    branch: main
    autoDeployTrigger: commit
    buildCommand: >-
      rm -rf .api-runtime &&
      mkdir .api-runtime &&
      cat deploy/api-source-v2.b64.* | base64 -d > /tmp/klyvero-api.tgz &&
      sha256sum -c deploy/api-source-v2.sha256 &&
      tar -xzf /tmp/klyvero-api.tgz -C .api-runtime &&
      cd .api-runtime &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @klyvero/api prisma:generate &&
      pnpm --filter @klyvero/api db:push &&
      pnpm --filter @klyvero/api build
    startCommand: >-
      cd .api-runtime &&
      export JWT_ACCESS_SECRET="$(printf '%s' "$JWT_ACCESS_SEED" | sha512sum | cut -d' ' -f1)" &&
      export JWT_REFRESH_SECRET="$(printf '%s' "$JWT_REFRESH_SEED" | sha512sum | cut -d' ' -f1)" &&
      exec pnpm --filter @klyvero/api start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://klyvero-web-v3-free.onrender.com
      - key: API_PUBLIC_URL
        value: https://klyvero-api-v6-free.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: klyvero-db-free
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: klyvero-cache-free
          property: connectionString
      - key: WHATSAPP_SERVICE_HOSTPORT
        fromService:
          type: web
          name: klyvero-whatsapp-v4-free
          property: hostport
      - key: WHATSAPP_INTERNAL_TOKEN
        fromService:
          type: web
          name: klyvero-whatsapp-v4-free
          envVarKey: INTERNAL_TOKEN
      - key: BOOTSTRAP_ENABLED
        value: 'true'
      - key: BOOTSTRAP_TOKEN
        sync: false
      - key: JWT_ACCESS_SEED
        generateValue: true
      - key: JWT_REFRESH_SEED
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_THROTTLE_SECRET
        generateValue: true
      - key: EMAIL_LINK_SIGNING_SECRET
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: klyvero-api
      - key: JWT_AUDIENCE
        value: klyvero-web
      - key: RUN_QUEUE_WORKERS
        value: 'true'
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: COOKIE_SECURE
        value: 'true'
      - key: ALLOW_PRIVATE_SMTP
        value: 'false'
      - key: ALLOW_PRIVATE_WEBHOOKS
        value: 'false'
      - key: SMTP_DEFAULT_HOST
        sync: false
      - key: SMTP_DEFAULT_PORT
        value: '587'
      - key: SMTP_DEFAULT_SECURE
        value: 'false'
      - key: SMTP_DEFAULT_USER
        sync: false
      - key: SMTP_DEFAULT_PASS
        sync: false
