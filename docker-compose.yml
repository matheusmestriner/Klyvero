services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [klyvero_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [klyvero_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
  whatsapp:
    build: { context: ./services/whatsapp }
    environment:
      PORT: ${WHATSAPP_SERVICE_PORT:-8090}
      INTERNAL_TOKEN: ${WHATSAPP_INTERNAL_TOKEN}
      DATABASE_DIR: /app/data
      EVENT_URL: http://api:4000/api/v1/internal/whatsapp/events
    volumes: [klyvero_whatsapp:/app/data]
    expose: ["8090"]
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
      REDIS_URL: redis://redis:6379
      WHATSAPP_SERVICE_URL: http://whatsapp:8090
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      SITE_NAME: ${SITE_NAME:-Klyvero}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-AI Sales OS para prospecção, CRM, campanhas, WhatsApp, IA e automação comercial.}
      SITE_KEYWORDS: ${SITE_KEYWORDS:-prospecção B2B, CRM, automação de vendas, cold email, WhatsApp, inteligência artificial, SaaS}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      TERMS_URL: ${TERMS_URL:-}
      COOKIE_POLICY_URL: ${COOKIE_POLICY_URL:-}
      SUPPORT_WHATSAPP_PHONE: ${SUPPORT_WHATSAPP_PHONE:-}
      SUPPORT_WHATSAPP_MESSAGE: ${SUPPORT_WHATSAPP_MESSAGE:-Olá! Preciso de ajuda com a plataforma.}
    depends_on: [api]
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  klyvero_postgres:
  klyvero_redis:
  klyvero_whatsapp:
