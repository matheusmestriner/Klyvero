name: Security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-guard:
    runs-on: ubuntu-latest
    env:
      PGPASS: klyvero-ci-only
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klyvero
          POSTGRES_PASSWORD: klyvero-ci-only
          POSTGRES_DB: klyvero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klyvero -d klyvero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository secret guard
        run: node scripts/secret-scan.mjs
      - name: Reject tracked sensitive files
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks|keystore|db|sqlite|sqlite3|dump|backup)$)' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            exit 1
          fi
      - name: Validate deploy runtime artifacts
        run: node scripts/validate-runtime-artifacts.mjs
      - name: Check web/API route contract
        run: node scripts/check-api-contract.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build and test WhatsApp service
        working-directory: services/whatsapp
        run: go test -mod=mod ./...
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @klyvero/api prisma:generate
      - name: Type-check and build API
        run: pnpm --filter @klyvero/api build
      - name: Test API
        run: pnpm --filter @klyvero/api test
      - name: Apply schema to the CI database
        run: pnpm --filter @klyvero/api db:push
        env:
          DATABASE_URL: postgresql://klyvero:${{ env.PGPASS }}@localhost:5432/klyvero?schema=public
      - name: API end-to-end tests (campaigns)
        run: pnpm --filter @klyvero/api test:e2e
        env:
          DATABASE_URL: postgresql://klyvero:${{ env.PGPASS }}@localhost:5432/klyvero?schema=public
      - name: Type-check web application
        run: pnpm --filter @klyvero/web lint
      - name: Build web application
        run: pnpm --filter @klyvero/web build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Bundle for Android
        run: npm run bundle
